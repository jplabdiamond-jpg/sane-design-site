name: SNS Auto Post (Instagram / X)

on:
  push:
    branches: [main]
    paths:
      - 'src/content/works/**.md'
      - 'src/content/blog/**.md'

concurrency:
  group: sns-autopost
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.changed.outputs.files }}
    steps:
      - name: Checkout (need previous commit for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect newly added work/blog files
        id: changed
        run: |
          FILES=$(git diff --name-only --diff-filter=A ${{ github.event.before }} ${{ github.sha }} -- 'src/content/works/**.md' 'src/content/blog/**.md' || true)
          echo "added files:"
          echo "$FILES"
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  # ── Instagram ──
  instagram:
    needs: detect
    if: needs.detect.outputs.files != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install sharp for WebP→JPEG conversion
        run: npm install sharp

      - name: Configure git for JPEG push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CHANGED_FILES: ${{ needs.detect.outputs.files }}
        run: node scripts/instagram-autopost.mjs

  # ── X (旧Twitter) ──
  x-post:
    needs: detect
    if: needs.detect.outputs.files != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          CHANGED_FILES: ${{ needs.detect.outputs.files }}
        run: node scripts/x-autopost.mjs
