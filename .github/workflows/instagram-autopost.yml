name: Instagram Auto Post

# main に push され、works の .md が追加されたら発火
on:
  push:
    branches: [main]
    paths:
      - 'src/content/works/**.md'

# 二重起動防止
concurrency:
  group: instagram-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (need previous commit for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect newly added work files
        id: changed
        run: |
          # 今回の push で「追加(A)」された works/*.md のみ抽出
          FILES=$(git diff --name-only --diff-filter=A ${{ github.event.before }} ${{ github.sha }} -- 'src/content/works/**.md' || true)
          echo "added files:"
          echo "$FILES"
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.changed.outputs.files != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install sharp for WebP→JPEG conversion
        if: steps.changed.outputs.files != ''
        run: npm install sharp

      - name: Configure git for JPEG push
        if: steps.changed.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Post to Instagram
        if: steps.changed.outputs.files != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: node scripts/instagram-autopost.mjs
